name: Build RAVLIN ISO

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a GitHub release with the built ISO"
        default: false
        required: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ravlin-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    # Same privileged Void container pattern void-mklive uses in its own CI.
    # --privileged is required: mklive bind-mounts /proc /sys /dev while
    # assembling the rootfs.
    container:
      image: "ghcr.io/void-linux/void-mklive:20250116R1"
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: "/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin"

    steps:
      - name: Prepare container
        shell: sh
        run: xbps-install -Syu xbps && xbps-install -yu

      - name: Checkout RAVLIN
        uses: classabbyamp/treeless-checkout-action@v1

      - name: Build ISO
        run: bash build.sh --native

      - name: Compute checksums
        run: |
          ls -lh ravlin-live-*.iso
          sha256sum ravlin-live-*.iso > sha256sum.txt
          cat sha256sum.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravlin-iso
          path: |
            ravlin-live-*.iso
            sha256sum.txt
          if-no-files-found: error

  boot-bios:
    name: Boot test (BIOS, via the ISO bootloader)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 40

    steps:
      - name: Checkout RAVLIN (test scripts)
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ravlin-iso

      - name: Install QEMU and expect
        run: |
          # azure apt mirrors on GH runners occasionally hang; fail fast at
          # the connection level, then retry the whole step
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            echo "== apt attempt $i =="
            if timeout 480 sudo apt-get update -qq $APT_OPTS && \
               timeout 480 sudo apt-get install -y -qq $APT_OPTS \
                 qemu-system-x86 expect; then
              exit 0
            fi
            sleep 15
          done
          echo "apt failed after 3 attempts"; exit 1

      # Boots the ISO with its own bootloader (SeaBIOS -> ISOLINUX -> kernel),
      # logs in over the serial console with expect, and asserts the RAVLIN
      # specifics: fish session, installer presence, identity, services
      # actually running, sound card detected.
      - name: Boot the ISO via its ISOLINUX bootloader and verify
        run: expect ci/smoke-bios.exp

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-bios-serial-log
          path: serial-bios.log
          if-no-files-found: ignore

  boot-uefi:
    name: Boot test (UEFI, via the ISO bootloader)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 50

    steps:
      - name: Checkout RAVLIN (test scripts)
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ravlin-iso

      - name: Install QEMU, OVMF and expect
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            echo "== apt attempt $i =="
            if timeout 480 sudo apt-get update -qq $APT_OPTS && \
               timeout 480 sudo apt-get install -y -qq $APT_OPTS \
                 qemu-system-x86 ovmf expect; then
              exit 0
            fi
            sleep 15
          done
          echo "apt failed after 3 attempts"; exit 1

      # Boots the ISO under OVMF so the EFI bootloader chain (OVMF -> GRUB
      # EFI -> kernel) is exercised, then verifies the live session over the
      # serial console.
      - name: Boot the ISO via its GRUB EFI bootloader and verify
        run: expect ci/smoke-uefi.exp

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-uefi-serial-log
          path: serial-uefi.log
          if-no-files-found: ignore

  install-test:
    name: Install test (real void-installer, local install)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 120

    steps:
      - name: Checkout RAVLIN (test scripts)
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ravlin-iso

      - name: Install QEMU and expect
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            echo "== apt attempt $i =="
            if timeout 480 sudo apt-get update -qq $APT_OPTS && \
               timeout 480 sudo apt-get install -y -qq $APT_OPTS \
                 qemu-system-x86 qemu-utils expect; then
              exit 0
            fi
            sleep 15
          done
          echo "apt failed after 3 attempts"; exit 1

      - name: Create blank target disk
        run: qemu-img create -f raw disk.img 8G

      # Installs RAVLIN exactly the way users do: boot the live ISO through
      # its own bootloader, then drive the real interactive void-installer
      # (dialog menus over the serial console) through a Local-source install
      # onto the blank disk. ci/install-ravlin.exp walks the same menus a
      # user sees; there is no separate CI install path.
      - name: Install RAVLIN with the interactive void-installer
        run: expect ci/install-ravlin.exp

      - name: Sanity-check the installed disk image
        run: |
          test -s disk.img
          qemu-img info disk.img | head -5

      # Test plumbing only: enable the serial console on the installed test
      # system so the next step can observe its boot. This happens after the
      # installation is complete and does not alter what is validated.
      - name: Enable the serial console on the installed disk (test plumbing)
        run: |
          set -euo pipefail
          LOOP="$(sudo losetup -fP --show disk.img)"
          echo "loop device: $LOOP"
          cleanup() {
            sudo umount -R /tmp/ravlin-root 2>/dev/null || true
            sudo losetup -d "$LOOP" 2>/dev/null || true
          }
          trap cleanup EXIT
          mkdir -p /tmp/ravlin-root
          sudo mount "${LOOP}p1" /tmp/ravlin-root
          for fs in proc sys dev; do
            sudo mount --bind "/$fs" "/tmp/ravlin-root/$fs"
          done
          sudo cp ci/postinstall-chroot.sh /tmp/ravlin-root/tmp/
          sudo chroot /tmp/ravlin-root /bin/sh /tmp/postinstall-chroot.sh

      # Phase 2: boot the freshly installed disk — no ISO attached — through
      # its own GRUB, and verify the installed system.
      - name: Boot the installed disk via its own GRUB and verify
        run: expect ci/verify-install.exp

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-serial-logs
          path: |
            install-serial.log
            verify-serial.log
          if-no-files-found: ignore

  release:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [boot-bios, boot-uefi, install-test]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ravlin-iso

      # By default the release is published on this repository. To publish
      # into a separate releases repository instead, set these two secrets:
      #   RELEASES_REPO  - e.g. "stainleSSStar/RAVLIN-releases"
      #   RELEASES_TOKEN - a PAT with contents:write on that repo
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ravlin-live-*.iso
            sha256sum.txt
          # workflow_dispatch runs carry no tag, but GitHub releases require
          # one: synthesize build-<run number> for manual runs.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          generate_release_notes: true
          make_latest: true
          repository: ${{ secrets.RELEASES_REPO || github.repository }}
          token: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
