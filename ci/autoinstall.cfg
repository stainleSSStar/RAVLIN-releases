#!/bin/sh
# RAVLIN CI autoinstall answer file.
# Served over HTTP (10.0.2.2:8000) during the CI install test and passed to
# the live image's built-in autoinstaller via kernel cmdline
#   root=vai auto=1 autourl=http://10.0.2.2:8000/autoinstall.cfg

disk="/dev/vda"
xbpsrepository="https://repo-default.voidlinux.org/current"

# RAVLIN package set on top of base-system (mirrors packages.txt)
pkgs="fish-shell dialog alsa-utils sof-firmware alsa-ucm-conf linux-firmware-network"

username="ravlin"
password="ravlin-ci"
hostname="ravlin-ci"
timezone="UTC"
keymap="us"
libclocale="en_US.UTF-8"

# After the install, apply RAVLIN branding (see ci/postinstall*.sh)
end_action="script"
end_script="http://10.0.2.2:8000/postinstall.sh"
