name: Build RAVLIN ISO

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a GitHub release with the built ISO"
        default: false
        required: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ravlin-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    # Same privileged Void container pattern void-mklive uses in its own CI.
    # --privileged is required: mklive bind-mounts /proc /sys /dev while
    # assembling the rootfs.
    container:
      image: "ghcr.io/void-linux/void-mklive:20250116R1"
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: "/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin"

    steps:
      - name: Prepare container
        shell: sh
        run: xbps-install -Syu xbps && xbps-install -yu

      - name: Checkout RAVLIN
        uses: classabbyamp/treeless-checkout-action@v1

      - name: Build ISO
        run: bash build.sh --native

      - name: Compute checksums
        run: |
          ls -lh ravlin-live-*.iso
          sha256sum ravlin-live-*.iso > sha256sum.txt
          cat sha256sum.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravlin-iso
          path: |
            ravlin-live-*.iso
            sha256sum.txt
          if-no-files-found: error

  smoke-test:
    name: Boot test (QEMU)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ravlin-iso

      - name: Install QEMU and expect
        run: |
          # azure apt mirrors on GH runners occasionally hang; fail fast at
          # the connection level, then retry the whole step
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            echo "== apt attempt $i =="
            if timeout 480 sudo apt-get update -qq $APT_OPTS && \
               timeout 480 sudo apt-get install -y -qq $APT_OPTS \
                 qemu-system-x86 expect xorriso; then
              exit 0
            fi
            sleep 15
          done
          echo "apt failed after 3 attempts"; exit 1

      - name: Extract kernel and initramfs from the ISO
        run: |
          xorriso -osirrox on -indev "$(ls ravlin-live-*.iso)" -extract /boot isoboot
          ls -lh isoboot/vmlinuz isoboot/initrd

      # Boots the live ISO headless in QEMU (software emulation — GitHub
      # runners have no KVM), logs in over the serial console with expect,
      # and asserts the RAVLIN specifics. The kernel cmdline mirrors the
      # ISO's default GRUB entry plus console=ttyS0 for the serial login.
      - name: Boot the live ISO and verify the session
        env:
          KAPPEND: >-
            root=live:CDLABEL=VOID_LIVE ro init=/sbin/init
            rd.luks=0 rd.md=0 rd.dm=0 loglevel=4 gpt add_efi_memmap
            vconsole.unicode=1 vconsole.keymap=us locale.LANG=en_US.UTF-8
            rd.overlayfs=1 live.shell=/usr/bin/fish console=ttyS0
        run: |
          cat > smoke.exp <<'EOF'
          set timeout 900
          log_file -noappend serial.log
          spawn qemu-system-x86_64 -m 3072 -smp 2 -nographic -no-reboot \
            -kernel isoboot/vmlinuz -initrd isoboot/initrd -append "$env(KAPPEND)" \
            -cdrom [glob ravlin-live-*.iso]

          # 1. boot reaches the login prompt
          expect {
              "login:"  { puts "\n=== CHECK 1 PASSED: login prompt ===" }
              timeout   { puts "\n=== CHECK 1 FAILED: boot timeout ==="; exit 1 }
              eof       { puts "\n=== CHECK 1 FAILED: qemu exited ==="; exit 1 }
          }

          # post-boot checks fail fast; fish wraps command echoes in ANSI
          # escapes, so match only contiguous output substrings
          set timeout 60
          send "root\r"
          expect "Password:"
          send "voidlinux\r"

          # 2. root lands in fish with the RAVLIN config (greeting is unique to it)
          expect {
              "minimal Void Linux remix" { puts "\n=== CHECK 2 PASSED: fish + RAVLIN config ===" }
              timeout { puts "\n=== CHECK 2 FAILED: no fish greeting ==="; exit 1 }
          }

          # 3. root's login shell is really fish
          send "status fish-path\r"
          expect {
              "/usr/bin/fish" { puts "\n=== CHECK 3 PASSED: root shell is fish ===" }
              timeout { puts "\n=== CHECK 3 FAILED: shell is not fish ==="; exit 1 }
          }

          # 4. the interactive console installer is on the image
          send "command -v void-installer\r"
          expect {
              "/usr/bin/void-installer" { puts "\n=== CHECK 4 PASSED: void-installer present ===" }
              timeout { puts "\n=== CHECK 4 FAILED: void-installer missing ==="; exit 1 }
          }

          # 5. RAVLIN identity survived into the image
          send "grep PRETTY /etc/os-release\r"
          expect {
              "_NAME=\"RAVLIN 0.1.0\"" { puts "\n=== CHECK 5 PASSED: RAVLIN os-release ===" }
              timeout { puts "\n=== CHECK 5 FAILED: os-release wrong ==="; exit 1 }
          }

          # 6. network + sound tooling present on the live image
          send "command -v wpa_supplicant; and command -v alsamixer\r"
          expect {
              "/usr/bin/alsamixer" { puts "\n=== CHECK 6 PASSED: wifi + sound tooling present ===" }
              timeout { puts "\n=== CHECK 6 FAILED: tooling missing ==="; exit 1 }
          }

          puts "\n=== ALL SMOKE CHECKS PASSED ==="
          send "\001x"
          expect eof
          EOF
          expect smoke.exp
          echo "serial log tail:" && tail -20 serial.log || true

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-serial-log
          path: serial.log
          if-no-files-found: ignore

  install-test:
    name: Install test (unattended install + boot)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 75

    steps:
      - name: Checkout RAVLIN
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ravlin-iso

      - name: Install QEMU and expect
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            echo "== apt attempt $i =="
            if timeout 480 sudo apt-get update -qq $APT_OPTS && \
               timeout 480 sudo apt-get install -y -qq $APT_OPTS \
                 qemu-system-x86 qemu-utils expect xorriso; then
              exit 0
            fi
            sleep 15
          done
          echo "apt failed after 3 attempts"; exit 1

      - name: Extract kernel and initramfs from the ISO
        run: |
          xorriso -osirrox on -indev "$(ls ravlin-live-*.iso)" -extract /boot isoboot
          ls -lh isoboot/vmlinuz isoboot/initrd

      # The live image's built-in autoinstaller (dracut module, included by
      # void-mklive) performs an unattended network install onto a blank disk
      # when booted with root=vai auto=1 autourl=... It installs base-system
      # plus the RAVLIN package set, then our postinstall applies branding
      # (fish shells, os-release, services) inside the fresh install.
      - name: Serve answer file and branding over HTTP
        run: |
          mkdir -p serve
          cp ci/autoinstall.cfg ci/postinstall.sh ci/postinstall-chroot.sh serve/
          cp -r rootfs/. serve/
          ls -R serve | head -40
          (python3 -m http.server 8000 --directory serve >/tmp/httpd.log 2>&1 &)
          sleep 2
          curl -fsS http://127.0.0.1:8000/autoinstall.cfg >/dev/null && echo "http server up"

      - name: Create blank target disk
        run: qemu-img create -f raw disk.img 8G

      - name: Run unattended install onto the disk
        run: |
          cat > install.exp <<'EOF'
          set timeout 2700
          log_file -noappend install-serial.log
          spawn qemu-system-x86_64 -m 3072 -smp 2 -nographic -no-reboot \
            -nic user,model=virtio-net-pci \
            -kernel isoboot/vmlinuz -initrd isoboot/initrd \
            -append "root=vai auto=1 autourl=http://10.0.2.2:8000/autoinstall.cfg console=ttyS0" \
            -cdrom [glob ravlin-live-*.iso] \
            -drive file=disk.img,format=raw,if=virtio

          expect {
              "RAVLIN_POSTINSTALL_DONE" { puts "\n=== INSTALL PASSED ===" }
              timeout { puts "\n=== INSTALL FAILED: timeout ==="; exit 1 }
              eof     { puts "\n=== INSTALL FAILED: qemu exited ==="; exit 1 }
          }

          send "\001x"
          expect eof
          EOF
          expect install.exp
          test -s disk.img
          qemu-img info disk.img | head -5

      # Phase 2: boot the freshly installed disk (no ISO attached) and
      # verify the installed system.
      - name: Boot the installed disk and verify
        run: |
          cat > verify.exp <<'EOF'
          set timeout 900
          log_file -noappend verify-serial.log
          spawn qemu-system-x86_64 -m 2048 -smp 2 -nographic -no-reboot \
            -nic user,model=virtio-net-pci \
            -drive file=disk.img,format=raw,if=virtio

          # 1. installed system reaches a login prompt
          expect {
              "login:" { puts "\n=== CHECK 1 PASSED: installed system boots ===" }
              timeout { puts "\n=== CHECK 1 FAILED: boot timeout ==="; exit 1 }
              eof     { puts "\n=== CHECK 1 FAILED: qemu exited ==="; exit 1 }
          }

          send "ravlin\r"
          expect "Password:"
          send "ravlin-ci\r"

          # 2. CI user's login shell is fish with the RAVLIN config
          expect {
              "minimal Void Linux remix" { puts "\n=== CHECK 2 PASSED: user shell is fish ===" }
              timeout { puts "\n=== CHECK 2 FAILED: no fish session ==="; exit 1 }
          }

          # post-login checks fail fast
          set timeout 60

          # 3. the system is booted from the installed disk, not the ISO
          send "mount | grep \" / \"\r"
          expect {
              "vda1" { puts "\n=== CHECK 3 PASSED: booted from disk ===" }
              timeout { puts "\n=== CHECK 3 FAILED: not booted from disk ==="; exit 1 }
          }

          # 4. RAVLIN identity on the installed system
          send "grep PRETTY /etc/os-release\r"
          expect {
              "_NAME=\"RAVLIN 0.1.0\"" { puts "\n=== CHECK 4 PASSED: RAVLIN os-release ===" }
              timeout { puts "\n=== CHECK 4 FAILED: os-release wrong ==="; exit 1 }
          }

          # 5. expected services enabled (sv status gives one deterministic
          #    line per call; with ls, column output can place an earlier
          #    expect's match before a later pattern's text in the stream)
          send "sv status dhcpcd\r"
          expect {
              "run: dhcpcd" { puts "\n=== CHECK 5 PASSED: dhcpcd enabled ===" }
              timeout { puts "\n=== CHECK 5 FAILED: dhcpcd not enabled ==="; exit 1 }
          }
          send "sv status wpa_supplicant\r"
          expect {
              "run: wpa_supplicant" { puts "\n=== CHECK 5b PASSED: wpa_supplicant enabled ===" }
              timeout { puts "\n=== CHECK 5b FAILED: wpa_supplicant not enabled ==="; exit 1 }
          }

          # 6. RAVLIN package set present on the installed system
          send "command -v alsamixer\r"
          expect {
              "/usr/bin/alsamixer" { puts "\n=== CHECK 6 PASSED: sound tooling installed ===" }
              timeout { puts "\n=== CHECK 6 FAILED: tooling missing ==="; exit 1 }
          }

          puts "\n=== ALL INSTALL CHECKS PASSED ==="
          send "\001x"
          expect eof
          EOF
          expect verify.exp

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-serial-logs
          path: |
            install-serial.log
            verify-serial.log
          if-no-files-found: ignore

  release:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [smoke-test, install-test]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ravlin-iso

      # By default the release is published on this repository. To publish
      # into a separate releases repository instead, set these two secrets:
      #   RELEASES_REPO  - e.g. "stainleSSStar/RAVLIN-releases"
      #   RELEASES_TOKEN - a PAT with contents:write on that repository
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ravlin-live-*.iso
            sha256sum.txt
          # workflow_dispatch runs carry no tag, but GitHub releases require
          # one: synthesize build-<run number> for manual runs.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          generate_release_notes: true
          make_latest: true
          repository: ${{ secrets.RELEASES_REPO || github.repository }}
          token: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
