# RAVLIN: keep our /etc/os-release across package updates.
#
# RAVLIN ships /etc/os-release as a regular file, while Void's base-files
# package owns the same path as a symlink to ../usr/lib/os-release. When a
# package entry and the file on disk differ in type, xbps removes the
# existing file and extracts the package's entry (lib/package_unpack.c in
# xbps) — so a base-files update or reinstall would silently restore
# Void's identity. A preserve pattern makes xbps skip the path entirely
# during unpacking, keeping RAVLIN's branding in place.
#
# This file is part of the live overlay and is copied onto installed
# systems by void-installer's local install, so the protection persists
# after installation.
preserve=/etc/os-release
